syntax = "proto3";

package android.videoencoding.app.proto;

option java_package = "android.videoencoding.app.proto";
option java_outer_classname = "VideoEncodingAppResultProto";

message VideoEncodingAppResult {
  // Map from output file name to transcoding FPS (throughput of the decode/encode operation).
  map<string, double> transcoding_fps_map = 1;
  // Map from output file name to encode FPS (average FPS of the produced content).
  map<string, double> encode_fps_map = 2;
}
